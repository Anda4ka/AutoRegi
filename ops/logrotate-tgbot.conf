# Rotation for the bot's append-only result mirror.
#
# Install: sudo cp ops/logrotate-tgbot.conf /etc/logrotate.d/tgbot
#
# This file used to name /tmp/tgbot_run.log, which does not exist and has not
# for as long as the service has run under systemd — the bot's stdout goes to
# the journal. So it rotated nothing, while the file that actually grows was
# never touched: ~11 MB a day, 91 MB by the time anyone looked.
#
# `bot_results.jsonl` is a best-effort audit mirror (`bot.db.append_bot_result`)
# and nothing in the codebase reads it back; SQLite is authoritative for every
# question it could answer. So it is safe to rotate on size and to keep only a
# few generations.
#
# No `copytruncate`: the writer opens the path fresh for each append, so a
# rename-and-create rotation lands cleanly and cannot lose the partial line
# that copytruncate races with.

/var/lib/autoreg/bot_results.jsonl {
    size 64M
    rotate 3
    missingok
    notifempty
    compress
    delaycompress
    create 0600 autoreg autoreg
    su autoreg autoreg
}
